[package]
name = "dj-os"
version = "0.1.0"
license = "GPL-3.0-or-later"
edition = "2021"
description = "Sistema de DJ all-in-one para a Pioneer DDJ-REV1"

[workspace]
members = [".", "analise", "preparar"]

[dependencies]
dj-os-analise = { path = "analise" }
eframe = "0.29"
cpal = "0.15"
midir = "0.10"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "isomp4", "flac", "wav", "pcm", "ogg", "vorbis", "alac"] }
parking_lot = { version = "0.12", features = ["deadlock_detection"] }
rtrb = "0.3"
libloading = "0.8"
libc = "0.2"
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.dev]
# Áudio precisa de velocidade mesmo em desenvolvimento.
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
