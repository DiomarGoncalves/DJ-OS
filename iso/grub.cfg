# Menu de boot da ISO do DJ OS (versão @VERSAO@).
# Texto simples e sem acentos: funciona em qualquer placa e em qualquer máquina virtual.
set timeout=5
set default=0
terminal_output console
# O Linux recebe uma tela gráfica básica (VESA/GOP) já ligada: se o driver da placa falhar,
# o sistema ainda abre nela (simpledrm).
insmod all_video
set gfxpayload=1366x768,1280x800,1280x720,1024x768,800x600

menuentry "DJ OS @VERSAO@ - testar sem instalar" {
    linux /live/vmlinuz boot=live components quiet splash loglevel=3 vt.global_cursor_default=0
    initrd /live/initrd.img
}
menuentry "DJ OS - INSTALAR NO DISCO (apaga o disco escolhido)" {
    linux /live/vmlinuz boot=live components quiet loglevel=3 djos.instalar
    initrd /live/initrd.img
}
menuentry "DJ OS - copiar registros do sistema instalado para o pendrive" {
    linux /live/vmlinuz boot=live components quiet loglevel=3 djos.registros
    initrd /live/initrd.img
}
menuentry "DJ OS - diagnostico (mostra as mensagens)" {
    linux /live/vmlinuz boot=live components loglevel=6 systemd.show_status=1 plymouth.enable=0 djos.diagnostico
    initrd /live/initrd.img
}
menuentry "DJ OS - modo de seguranca (video basico)" {
    # Sem o driver da placa: só a tela básica, desenhada pelo processador.
    linux /live/vmlinuz boot=live components nomodeset quiet splash loglevel=3 djos.video=basico
    initrd /live/initrd.img
}
