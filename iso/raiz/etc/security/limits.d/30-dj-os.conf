# DJ OS: o som passa na frente de todo o resto.
#
# Sem isto o PipeWire e o DJ OS pedem prioridade de tempo real e o sistema nega (o aparelho não
# tem o serviço rtkit): o som fica disputando o processador com a tela, com a análise das
# músicas e com a leitura do pendrive, e estala quando o computador está ocupado ou quente.
# Vale para a sessão do aparelho (tty1) e para os serviços do usuário (PipeWire, WirePlumber).
