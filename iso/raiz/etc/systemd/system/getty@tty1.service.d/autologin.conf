# Entra sozinho com o usuário "dj" na tela 1 (o .bash_profile abre o DJ OS).
# No boot de instalação (djos.instalar) ou de copiar registros (djos.registros) a tela 1 fica com eles.
[Service]
ExecCondition=/bin/sh -c '! grep -q -e djos.instalar -e djos.registros /proc/cmdline'
ExecStart=
ExecStart=-/sbin/agetty --autologin dj --noclear --skip-login --nonewline --noissue %I $TERM
