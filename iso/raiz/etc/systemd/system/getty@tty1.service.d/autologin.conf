# Entra sozinho com o usuário "dj" na tela 1 (o .bash_profile abre o DJ OS).
# No boot de instalação (djos.instalar) a tela 1 fica com o instalador.
[Service]
ExecCondition=/bin/sh -c '! grep -q djos.instalar /proc/cmdline'
ExecStart=
ExecStart=-/sbin/agetty --autologin dj --noclear --skip-login --nonewline --noissue %I $TERM
