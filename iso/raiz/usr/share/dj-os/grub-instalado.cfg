# Boot do DJ OS instalado. Duas versões do sistema (pastas a/ e b/ na parte DJOS_SISTEMA).
#
# Memória (grubenv, na parte DJOS_BOOT):
#   ativo     versão que funciona (a ou b)
#   novo      versão recém-instalada pela atualização: liga uma vez para teste
#   testando  versão em teste: o sistema confirma depois de rodar 30 s (dj-os-firmware confirmar)
# Se a versão nova não ligar direito, ninguém confirma e o próximo boot volta para a "ativo".
#   boot_ok   1 quando o último boot chegou até o DJ OS aberto (o sistema marca depois de 30 s);
#             se não chegou, este boot mostra o menu (para escolher segurança ou diagnóstico).
insmod part_gpt
insmod fat
insmod ext2
insmod all_video
terminal_output console
# Menu escondido: liga direto na logo. Segurar Esc ao ligar mostra o menu (versão anterior,
# modo de segurança, diagnóstico). Se o último boot não chegou até o DJ OS, o menu aparece sozinho.
set timeout=1
set timeout_style=hidden
set gfxpayload=1366x768,1280x800,1280x720,1024x768,800x600

load_env
if [ "$boot_ok" != 1 ]; then
    set timeout=10
    set timeout_style=menu
fi
set boot_ok=0
save_env boot_ok
# O sistema fica no mesmo disco deste menu (parte 3). Procurar pela etiqueta pegaria o de outro
# disco se houver mais de um DJ OS na máquina (ex.: uma instalação antiga estragada).
insmod regexp
insmod probe
set sis=
regexp --set=1:disco '^(.*),gpt[0-9]+$' "$root"
if [ -n "$disco" ]; then
    if [ -f "($disco,gpt3)/a/versao" ]; then set sis="$disco,gpt3"
    elif [ -f "($disco,gpt3)/b/versao" ]; then set sis="$disco,gpt3"; fi
fi
if [ -z "$sis" ]; then search --no-floppy --label --set=sis DJOS_SISTEMA; fi
probe --fs-uuid --set=sis_uuid "($sis)"
set midia=/dev/disk/by-uuid/$sis_uuid
if [ -z "$ativo" ]; then set ativo=a; fi
set slot=$ativo
if [ -n "$novo" ]; then
    set slot=$novo
    set testando=$novo
    set novo=
    save_env novo testando
fi
if [ "$slot" = a ]; then set outro=b; else set outro=a; fi
# Se o kernel não carregar: confere os arquivos no disco e deixa o resultado na tela (para foto).
function falhou {
    echo
    echo "O DJ OS nao conseguiu ligar a versao $1. TIRE UMA FOTO DESTA TELA."
    echo "Disco: $sis   (menu em $root)"
    ls -l ($sis)/$1/
    echo "Conferindo o kernel no disco (OK = certo, HASH MISMATCH = estragado no disco):"
    insmod hashsum
    sha256sum --keep-going --check ($sis)/$1/boot.sha256 --prefix ($sis)/$1
    echo
    echo "Aperte Esc para voltar ao menu."
    sleep --interruptible 900
}

set opcoes="boot=live live-media=$midia quiet splash loglevel=3 vt.global_cursor_default=0"

menuentry "DJ OS" {
    if linux ($sis)/$slot/vmlinuz $opcoes live-media-path=/$slot djos.slot=$slot; then
        if initrd ($sis)/$slot/initrd.img; then true; else falhou $slot; fi
    else
        falhou $slot
    fi
}
if [ -f ($sis)/$outro/vmlinuz ]; then
    menuentry "DJ OS - versao anterior" {
        if linux ($sis)/$outro/vmlinuz $opcoes live-media-path=/$outro djos.slot=$outro; then
            if initrd ($sis)/$outro/initrd.img; then true; else falhou $outro; fi
        else
            falhou $outro
        fi
    }
fi
menuentry "DJ OS - modo de seguranca (video basico)" {
    if linux ($sis)/$slot/vmlinuz $opcoes live-media-path=/$slot djos.slot=$slot nomodeset djos.video=basico; then
        if initrd ($sis)/$slot/initrd.img; then true; else falhou $slot; fi
    else
        falhou $slot
    fi
}
menuentry "DJ OS - diagnostico (mostra as mensagens)" {
    if linux ($sis)/$slot/vmlinuz boot=live live-media=$midia live-media-path=/$slot djos.slot=$slot loglevel=6 systemd.show_status=1 plymouth.enable=0 djos.diagnostico; then
        if initrd ($sis)/$slot/initrd.img; then true; else falhou $slot; fi
    else
        falhou $slot
    fi
}
