# Boot do DJ OS instalado. Duas versões do sistema (pastas a/ e b/ na parte DJOS_SISTEMA).
#
# Memória (grubenv, na parte DJOS_BOOT):
#   ativo     versão que funciona (a ou b)
#   novo      versão recém-instalada pela atualização: liga uma vez para teste
#   testando  versão em teste: o sistema confirma depois de rodar 30 s (dj-os-firmware confirmar)
# Se a versão nova não ligar direito, ninguém confirma e o próximo boot volta para a "ativo".
insmod part_gpt
insmod fat
insmod ext2
insmod all_video
terminal_output console
# Menu escondido: liga direto na logo. Segurar Esc ao ligar mostra o menu
# (versão anterior, modo de segurança).
set timeout=1
set timeout_style=hidden
set gfxpayload=1366x768,1280x800,1280x720,1024x768,800x600

load_env
search --no-floppy --label --set=sis DJOS_SISTEMA
if [ -z "$ativo" ]; then set ativo=a; fi
set slot=$ativo
if [ -n "$novo" ]; then
    set slot=$novo
    set testando=$novo
    set novo=
    save_env novo testando
fi
if [ "$slot" = a ]; then set outro=b; else set outro=a; fi
set opcoes="boot=live live-media=/dev/disk/by-label/DJOS_SISTEMA quiet splash loglevel=3 vt.global_cursor_default=0"

menuentry "DJ OS" {
    linux ($sis)/$slot/vmlinuz $opcoes live-media-path=/$slot djos.slot=$slot
    initrd ($sis)/$slot/initrd.img
}
if [ -f ($sis)/$outro/vmlinuz ]; then
    menuentry "DJ OS - versao anterior" {
        linux ($sis)/$outro/vmlinuz $opcoes live-media-path=/$outro djos.slot=$outro
        initrd ($sis)/$outro/initrd.img
    }
fi
menuentry "DJ OS - modo de seguranca (video basico)" {
    linux ($sis)/$slot/vmlinuz $opcoes live-media-path=/$slot djos.slot=$slot nomodeset djos.video=basico
    initrd ($sis)/$slot/initrd.img
}
